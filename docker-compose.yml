version: '3.9'

services:
  # PostgreSQL Database with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: catnet-postgres
    environment:
      POSTGRES_DB: catnet
      POSTGRES_USER: catnet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catnet_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - catnet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catnet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: catnet-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - catnet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HashiCorp Vault
  vault:
    image: hashicorp/vault:latest
    container_name: catnet-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-vault_dev_token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./configs/vault:/vault/config:ro
    ports:
      - "8200:8200"
    networks:
      - catnet-network
    command: server -dev

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: catnet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-catnet}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-catnet_password}
      RABBITMQ_DEFAULT_VHOST: catnet
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - catnet-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main API Gateway
  catnet-main:
    build: .
    container_name: catnet-main
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --service main
    environment:
      DATABASE_URL: postgresql+asyncpg://catnet:${DB_PASSWORD:-catnet_password}@postgres:5432/catnet
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-vault_dev_token}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-catnet}:${RABBITMQ_PASSWORD:-catnet_password}@rabbitmq:5672/catnet
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      GIT_WEBHOOK_SECRET: ${GIT_WEBHOOK_SECRET:-change-this-webhook-secret}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./logs:/var/log/catnet
      - ./certs:/etc/catnet/certs:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - catnet-network
    restart: unless-stopped

  # Authentication Service
  catnet-auth:
    build: .
    container_name: catnet-auth
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --service auth
    environment:
      DATABASE_URL: postgresql+asyncpg://catnet:${DB_PASSWORD:-catnet_password}@postgres:5432/catnet
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-vault_dev_token}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./logs:/var/log/catnet
      - ./certs:/etc/catnet/certs:ro
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
    networks:
      - catnet-network
    restart: unless-stopped

  # GitOps Service
  catnet-gitops:
    build: .
    container_name: catnet-gitops
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --service gitops
    environment:
      DATABASE_URL: postgresql+asyncpg://catnet:${DB_PASSWORD:-catnet_password}@postgres:5432/catnet
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-vault_dev_token}
      GIT_WEBHOOK_SECRET: ${GIT_WEBHOOK_SECRET:-change-this-webhook-secret}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./logs:/var/log/catnet
      - ./certs:/etc/catnet/certs:ro
      - ./repos:/app/repos
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
    networks:
      - catnet-network
    restart: unless-stopped

  # Deployment Service
  catnet-deployment:
    build: .
    container_name: catnet-deployment
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --service deployment
    environment:
      DATABASE_URL: postgresql+asyncpg://catnet:${DB_PASSWORD:-catnet_password}@postgres:5432/catnet
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-vault_dev_token}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-catnet}:${RABBITMQ_PASSWORD:-catnet_password}@rabbitmq:5672/catnet
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./logs:/var/log/catnet
      - ./certs:/etc/catnet/certs:ro
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - catnet-network
    restart: unless-stopped

  # Device Service
  catnet-device:
    build: .
    container_name: catnet-device
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --service device
    environment:
      DATABASE_URL: postgresql+asyncpg://catnet:${DB_PASSWORD:-catnet_password}@postgres:5432/catnet
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-vault_dev_token}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./logs:/var/log/catnet
      - ./certs:/etc/catnet/certs:ro
      - ./sessions:/var/log/catnet/sessions
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
    networks:
      - catnet-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: catnet-prometheus
    volumes:
      - ./configs/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - catnet-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: catnet-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - catnet-network
    restart: unless-stopped

networks:
  catnet-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  vault_data:
  vault_logs:
  rabbitmq_data:
  prometheus_data:
  grafana_data: