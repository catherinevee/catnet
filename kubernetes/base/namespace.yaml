apiVersion: v1
kind: Namespace
metadata:
  name: catnet
  labels:
    app: catnet
    environment: production
    security.catnet.io/level: critical
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: catnet-quota
  namespace: catnet
spec:
  hard:
    requests.cpu: "100"
    requests.memory: 200Gi
    limits.cpu: "200"
    limits.memory: 400Gi
    persistentvolumeclaims: "20"
    services: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: catnet-limits
  namespace: catnet
spec:
  limits:
  - default:
      cpu: "2"
      memory: 4Gi
    defaultRequest:
      cpu: 500m
      memory: 1Gi
    type: Container
  - max:
      storage: 100Gi
    type: PersistentVolumeClaim