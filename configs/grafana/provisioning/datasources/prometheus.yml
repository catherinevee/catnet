apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
      queryTimeout: 60s
      httpMethod: POST
    version: 1

  - name: CatNet-Postgres
    type: postgres
    url: postgres:5432
    database: catnet
    user: catnet
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: require
      postgresVersion: 1400
      timescaledb: false
    version: 1
    readOnly: true