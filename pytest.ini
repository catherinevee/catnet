[tool:pytest]
minversion = 7.0
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    --tb=short
    --maxfail=3
    --durations=10
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    security: marks tests as security tests
    performance: marks tests as performance tests
    e2e: marks tests as end-to-end tests
    asyncio: marks tests as asyncio tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    critical: marks tests as critical functionality
    auth: marks tests as authentication related
    devices: marks tests as device management related
    deployment: marks tests as deployment related
    gitops: marks tests as gitops related
    monitoring: marks tests as monitoring related
    vault: marks tests as vault integration
    database: marks tests as database related
    api: marks tests as API related
    network: marks tests as network related
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
junit_family = xunit2